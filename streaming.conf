# CUBIT Streaming System Configuration File
# Lines starting with # are comments
# Format: key=value

# Camera Settings
camera_width=1920
camera_height=1080
camera_fps=60
camera_device="/dev/video0"

# Encoding Settings
# Bitrate in bits per second
initial_bitrate=5000000
min_bitrate=2000000
max_bitrate=10000000

# Encoder preset: ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow
encoder_preset="fast"

# Use hardware encoding if available (true/false)
use_nvenc=true

# Network Settings
udp_port=5000

# Performance Settings
capture_queue_size=10
encode_queue_size=10
